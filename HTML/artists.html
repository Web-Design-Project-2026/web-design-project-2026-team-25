<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../CSS/main.css" />

    <title>Artists</title>
  </head>
  <body>
    <header id="header"></header>
    <div class="bg-stars">
      <span class="star star1">✦</span>
      <span class="star star2">✦</span>
      <span class="star star3">✦</span>
      <span class="star star4">✦</span>
      <span class="star star5">✦</span>
      <span class="star star6">✦</span>
      <span class="star star7">✦</span>
      <span class="star star8">✦</span>
    </div>

    <main class="container">
      <div class="pink-box3">
        <section class="artists">
          <h1 class="artists-title">ARTISTS</h1>

          <div class="day-titles">
            <h2>Friday 17/7</h2>
            <h2>Saturday 18/7</h2>
          </div>

          <div class="artist-grid">
            <div class="artist-column">
              <div class="mobile-day">Friday 17/7</div>

              <div class="artist-card">
                <img src="../images/veronicamaggio.jpg" alt="Artist image of Veronica Maggio" />
                <h2>Veronica Maggio</h2>
              </div>

              <div class="artist-card">
                <img src="../images/mollysanden.jpeg" alt="Artist image of Molly Sanden" />
                <h2>Molly Sanden</h2>
              </div>

              <div class="artist-card">
                <img src="../images/viktorleksell.jpg" alt="Artist image of Viktor Leksell" />
                <h2>Viktor Leksell</h2>
              </div>

              <div class="artist-card">
                <img
                  src="../images/soppgirobryggeriet.png" alt="Artist image of Soppgirobryggeriet"
                />
                <h2>Soppgirobryggeriet</h2>
              </div>

              <div class="artist-card">
                <img src="../images/miriambryant.jpg" alt="Artist image of Miriam Bryant" />
                <h2>Miriam Bryant</h2>
              </div>

              <div class="artist-card">
                <img src="../images/hov1.jpg" alt="Artist image of Hov1" />
                <h2>Hov1</h2>
              </div>
            </div>

            <div class="artist-column">
              <div class="mobile-day">Saturday 18/7</div>

              <div class="artist-card">
                <img
                  src="../images/benjaminingrosso.png"
                  alt="Artist image of Benjamin Ingrosso"
                />
                <h2>Benjamin Ingrosso</h2>
              </div>

              <div class="artist-card">
                <img src="../images/zaralarsson.webp" alt="Artist image of Zara Larsson" />
                <h2>Zara Larsson</h2>
              </div>

              <div class="artist-card">
                <img
                  src="../images/swedishhousemaffia.jpeg"
                  alt="Artist image of Swedish House Maffia"
                />
                <h2>Swedish House Maffia</h2>
              </div>

              <div class="artist-card">
                <img src="../images/estraden.jpeg" alt="Artist image of Estraden" />
                <h2>Estraden</h2>
              </div>

              <div class="artist-card">
                <img src="../images/carola.webp" alt="Artist image of Carola" />
                <h2>Carola</h2>
              </div>

              <div class="artist-card">
                <img src="../images/tjuvjakt.jpeg" alt="Artist image of Tjuvjakt" />
                <h2>Tjuvjakt</h2>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
    <div id="footer"></div>
    <script src="../JS/script.JS"></script>
  </body>
</html>
